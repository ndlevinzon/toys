# Headless HPC + PyVista/VTK (reference renders, slow voxel debug, VTK curvatures).
# Same as environment-hpc.yml but keeps visualization deps in the YAML so
# ``conda env update`` does not drop them when you avoid manual installs.
#
#   conda env create -f environment-hpc-viz.yml
#   conda activate anisotropy-hpc-viz
#
# After git pull:
#   bash hpc/sync_env.sh   # with ANISOTROPY_ENV_FILE=environment-hpc-viz.yml

name: anisotropy-hpc-viz
channels:
  - conda-forge
dependencies:
  - python=3.12
  - numpy>=1.26
  - scipy>=1.11
  - scikit-image>=0.22
  - matplotlib>=3.8
  - pyyaml>=6
  - tqdm>=4.66
  - propka>=3.5
  - pyvista>=0.43
  - vtk
  - pip
  - pip:
      - -e .
