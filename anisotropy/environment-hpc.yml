# Slurm / headless clusters — no PyVista/VTK (use --no-render on orientation_sample).
# parameterize_mesh.py uses discrete curvatures without PyVista.
#
#   conda env create -f environment-hpc.yml
#   conda activate anisotropy-hpc
#
# After git pull:
#   bash hpc/sync_env.sh

name: anisotropy-hpc
channels:
  - conda-forge
dependencies:
  - python=3.12
  - numpy>=1.26
  - scipy>=1.11
  - scikit-image>=0.22
  - matplotlib>=3.8
  - pyyaml>=6
  - tqdm>=4.66
  - propka>=3.5
  - pip
  - pip:
      - -e .
